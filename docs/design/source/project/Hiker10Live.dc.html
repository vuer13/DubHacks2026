<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TrailSense hiker screen, live mode</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#0B1410}
a{color:#5FC98A}a:hover{color:#9ED8AE}
:focus-visible{outline:3px solid #F2F5F0;outline-offset:3px;border-radius:inherit}
@keyframes ts-blink{0%,100%{opacity:1}50%{opacity:.25}}
.ts-blink{animation:ts-blink 1.2s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.ts-blink{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B1410; color: #F2F5F0; font-family: -apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', sans-serif; display: flex; flex-direction: column; overflow: hidden">

<div style="display: flex; align-items: center; justify-content: space-between; height: 52px; padding: 8px 16px 0; box-sizing: border-box; flex-shrink: 0">
<span style="font-size: 20px; line-height: 26px; font-weight: 600; color: #AEBBB2">TrailSense</span>
<span role="img" aria-label="All systems healthy" style="width: 16px; height: 16px; border-radius: 50%; background: #4CC37A"></span>
</div>

<div role="img" aria-label="Live camera preview, analysing" style="position: relative; width: 390px; height: 219px; flex-shrink: 0; background: #13201A; overflow: hidden">
<svg aria-hidden="true" width="390" height="219" viewBox="0 0 390 219" style="position: absolute; left: 0; top: 0"><path d="M0 70 L390 70 L390 219 L0 219 Z" fill="#1B2C23"></path><path d="M120 219 L170 90 L220 90 L270 219 Z" fill="#2A3F33"></path><path d="M0 60 L40 40 L90 66 L140 30 L200 62 L250 36 L310 64 L350 44 L390 60" fill="none" stroke="#2A3F33" stroke-width="3"></path><circle cx="60" cy="150" r="10" fill="#2A3F33"></circle><circle cx="330" cy="170" r="14" fill="#2A3F33"></circle></svg>
<div style="position: absolute; right: 12px; bottom: 12px; display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 14px; border-radius: 999px; background: #0B1410; border: 2px solid #2A3F33; color: #F2F5F0; font-size: 18px; line-height: 24px; font-weight: 600"><span aria-hidden="true" class="ts-blink" style="width: 12px; height: 12px; border-radius: 50%; background: #5FC98A"></span><span>Analysing</span></div>
</div>

<button type="button" aria-expanded="false" aria-label="Event log, 1 event, collapsed" style="display: flex; align-items: center; justify-content: space-between; width: 100%; height: 64px; padding: 0 16px; box-sizing: border-box; background: #0B1410; border: 0; border-bottom: 2px solid #2A3F33; color: #F2F5F0; font: inherit; font-size: 20px; font-weight: 600; cursor: pointer; flex-shrink: 0; text-align: left">
<span>Event log</span>
<span style="display: flex; align-items: center; gap: 12px; color: #AEBBB2; font-weight: 500"><span>1</span><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></span>
</button>

<div style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 20px; padding: 24px 16px; box-sizing: border-box; min-height: 0; background: #1B5A38; color: #F2F5F0">
<div style="display: flex; align-items: center; gap: 12px"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"></path></svg><span style="font-size: 24px; line-height: 30px; font-weight: 600">Live</span></div>
<p aria-live="assertive" aria-atomic="true" style="margin: 0; font-size: 56px; line-height: 1.05; font-weight: 700; letter-spacing: -0.015em">Trail clear</p>
</div>

<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 144px; padding: 8px 16px 24px; box-sizing: border-box; flex-shrink: 0; border-top: 2px solid #2A3F33">
<button type="button" role="switch" aria-checked="true" aria-label="Live mode, on" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 64px; padding: 0 6px; border-radius: 999px; background: #1B5A38; border: 3px solid #5FC98A; color: #F2F5F0; font: inherit; font-size: 18px; font-weight: 600; cursor: pointer; box-sizing: border-box; min-width: 0"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M5 12l5 5L20 7"></path></svg><span>Live</span></button>
<button type="button" aria-label="Ask TrailSense" style="width: 112px; height: 112px; flex-shrink: 0; border-radius: 50%; background: #1B2C23; border: 3px solid #5FC98A; color: #F2F5F0; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; box-sizing: border-box"><svg aria-hidden="true" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0"></path><path d="M12 18v3"></path></svg></button>
<button type="button" role="switch" aria-checked="false" aria-label="Low vision display, off" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 64px; padding: 0 6px; border-radius: 999px; background: #1B2C23; border: 3px solid #AEBBB2; color: #F2F5F0; font: inherit; font-size: 18px; font-weight: 600; cursor: pointer; box-sizing: border-box; min-width: 0">Low vision</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
